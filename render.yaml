services:
  - type: web
    name: sky-grab
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    repo: https://github.com/MuhamadHafizSaputra/sky-grab
    plan: free
    healthCheckPath: /
    preDeployCommand: "php artisan migrate --force --no-interaction && php artisan config:cache && php artisan route:cache && php artisan view:cache"
    envVars:
      - key: APP_NAME
        value: SkyGrab
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false  # Set manually in Render dashboard
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false  # Set to Aiven MySQL host
      - key: DB_PORT
        sync: false  # Set to Aiven MySQL port
      - key: DB_DATABASE
        sync: false  # Set to Aiven database name
      - key: DB_USERNAME
        sync: false  # Set to Aiven username
      - key: DB_PASSWORD
        sync: false  # Set to Aiven password
      - key: MYSQL_ATTR_SSL_CA
        value: /etc/ssl/certs/ca-certificates.crt
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: cookie
      - key: CACHE_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
