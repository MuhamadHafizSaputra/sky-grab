services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skygrab-app
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=skygrab
      - DB_USERNAME=skygrab_user
      - DB_PASSWORD=secret
    depends_on:
      db:
        condition: service_healthy
    networks:
      - skygrab-network

  db:
    image: mysql:8.0
    container_name: skygrab-db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: skygrab
      MYSQL_USER: skygrab_user
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - skygrab-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootsecret"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - skygrab-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: skygrab-pma
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: rootsecret
    depends_on:
      db:
        condition: service_healthy
    networks:
      - skygrab-network

volumes:
  skygrab-db-data:

networks:
  skygrab-network:
    driver: bridge
